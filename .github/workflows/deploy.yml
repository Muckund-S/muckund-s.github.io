name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Portfolio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Portfolio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-build content collections
        run: pnpm exec content-collections build --config content-collections.ts
        continue-on-error: true

      - name: Compile production files
        run: pnpm run build

      - name: Prepare static output for Pages
        run: |
          # public/contact.html is only the Netlify Forms stub; it would shadow the /contact page.
          rm -f dist/client/contact.html
          cp dist/client/index.html dist/client/404.html

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Portfolio/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
